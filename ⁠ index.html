<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VALENCE - Store</title>
  <style>
    body {
      background-color: #0b101d;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
    }
    .logo::after {
      content: '.';
      color: #dc2626;
    }
    .section-title {
      font-size: 20px;
      margin: 30px 0 15px 0;
      color: #60a5fa;
      border-right: 4px solid #2563eb;
      padding-right: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }
    .card {
      background: #121829;
      border: 1px solid #1e293b;
      padding: 20px;
      border-radius: 10px;
    }
    .card h3 {
      margin-top: 0;
    }
    .btn {
      display: block;
      background: #2563eb;
      color: #fff;
      text-align: center;
      padding: 10px;
      text-decoration: none;
      border-radius: 6px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VALENCE</div>
  </header>

  <div class="section-title">قسم الهوديز (HOODIES)</div>
  <div class="grid">
    <div class="card">
      <h3>VALENCE Oversized Hoodie</h3>
      <p>هودي أوفرسايز بتصميم عصري لخامة ثقيلة.</p>
      <a href="#" class="btn">تصفح الهودي</a>
    </div>
  </div>

  <div class="section-title">قسم البنطلونات (PANTS)</div>
  <div class="grid">
    <div class="card">
      <h3>VALENCE Cargo Pants</h3>
      <p>بنطلون كارجو متعدد الجيوب بقصة مريحة.</p>
      <a href="#" class="btn">تصفح البنطلونات</a>
    </div>
  </div>

</body>
</html>
