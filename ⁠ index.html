<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALENCE — Streetwear Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #111116;
            --accent-color: #00ff87;
            --text-main: #f0f0f5;
            --text-sub: #8888a0;
            --border: #22222e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(8, 8, 10, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 20px;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px 40px;
            position: relative;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(40px, 8vw, 90px);
            font-weight: 900;
            letter-spacing: 10px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #444455 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 40px 8%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 135, 0.1);
        }

        .product-img {
            width: 100%;
            height: 260px;
            background: #181820;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--text-sub);
            font-size: 40px;
            position: relative;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-btn {
            margin-top: auto;
            background: #22222e;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        footer {
            margin-top: auto;
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 30px;
            color: var(--text-sub);
            font-size: 13px;
        }

        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .cart-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .close-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">VALENCE</div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <section class="hero">
        <h1>VALENCE</h1>
        <p>DROP 01 // STREETWEAR ESSENTIALS</p>
    </section>

    <section class="products">
        <div class="product-card">
            <div class="product-img">
                ⚡
                <span class="badge">جديد</span>
            </div>
            <div class="product-title">Valence Oversized Hoodie</div>
            <div class="product-price">1,200 EGP</div>
            <button class="add-btn" onclick="addToCart('Oversized Hoodie')">إضافة للسلة</button>
        </div>

        <div class="product-card">
            <div class="product-img">
                🔥
                <span class="badge">الأكثر مبيعاً</span>
            </div>
            <div class="product-title">Heavyweight Graphic Tee</div>
            <div class="product-price">650 EGP</div>
            <button class="add-btn" onclick="addToCart('Graphic Tee')">إضافة للسلة</button>
        </div>

        <div class="product-card">
            <div class="product-img">
                👁️
                <span class="badge">كمية محدودة</span>
            </div>
            <div class="product-title">Tactical Cargo Pants</div>
            <div class="product-price">1,450 EGP</div>
            <button class="add-btn" onclick="addToCart('Cargo Pants')">إضافة للسلة</button>
        </div>
    </section>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <h2>سلة التسوق</h2>
            <p id="cartItems" style="margin: 20px 0; color: var(--text-sub);">السلة فارغة حالياً</p>
            <button class="add-btn" style="width: 100%; background: var(--accent-color); color: #000;" onclick="alert('سندخل مرحلة الدفع والطلب قريباً!')">إتمام الطلب</button>
            <br>
            <button class="close-btn" onclick="toggleCart()">إغلاق</button>
        </div>
    </div>

    <footer>
        &copy; 2026 VALENCE WORLDWIDE. ALL RIGHTS RESERVED.
    </footer>

    <script>
        let count = 0;
        let items = [];

        function addToCart(itemName) {
            count++;
            items.push(itemName);
            document.getElementById('cartCount').innerText = count;
            alert('تمت إضافة ' + itemName + ' إلى السلة!');
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            const cartItemsText = document.getElementById('cartItems');
            
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                if(items.length > 0) {
                    cartItemsText.innerText = "المنتجات المختارة: " + items.join(', ');
                } else {
                    cartItemsText.innerText = "السلة فارغة حالياً";
                }
            }
        }
    </script>

</body>
</html>
